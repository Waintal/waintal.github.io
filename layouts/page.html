{{ define "main" }}
<div class="page-head">
  <h1>{{ .Title }}</h1>
  {{ if eq .Section "blog" }}<p class="post-meta">{{ .Date.Format "2 January 2006" }}</p>{{ else }}{{ with .Params.subtitle }}<p class="sub">{{ . }}</p>{{ end }}{{ end }}
</div>
<article class="prose">{{ .Content }}</article>
{{ if eq .Section "blog" }}<p><a href="{{ "blog/" | relURL }}">← All posts</a></p>{{ end }}
{{ end }}
